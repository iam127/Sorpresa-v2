<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #fdf6ee;
      --rose: #c96a6a;
      --dusty: #b07a7a;
      --sage: #8a9e85;
      --bark: #6b4f3a;
      --petal: #e8a0a0;
      --soft: #f7e8e0;
    }
    html, body { width: 100%; height: 100%; }
    body {
      background: var(--cream);
      font-family: 'Josefin Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: default;
      position: relative;
    }

    .floral-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }
    .floral-corner.tl { top: -10px; left: -10px; }
    .floral-corner.tr { top: -10px; right: -10px; transform: scaleX(-1); }
    .floral-corner.bl { bottom: -10px; left: -10px; transform: scaleY(-1); }
    .floral-corner.br { bottom: -10px; right: -10px; transform: scale(-1,-1); }

    .petal-float {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: petalFall linear infinite;
    }
    @keyframes petalFall {
      0%   { opacity: 0; transform: translateY(-40px) rotate(0deg); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(105vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      max-width: 760px;
      padding: 2rem 1.5rem;
    }

    .eyebrow {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dusty);
      margin-bottom: 0.8rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 300;
      font-style: italic;
      color: var(--bark);
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--dusty);
      margin-bottom: 3rem;
      letter-spacing: 0.05em;
    }

    /* Botón flotante sin arena visible */
    #runBtn {
      position: relative;
      display: inline-block;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      background: var(--rose);
      border: none;
      padding: 16px 40px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(180,80,80,0.22);
      transition: box-shadow 0.2s, background 0.4s;
    }
    #runBtn:hover {
      box-shadow: 0 6px 32px rgba(180,80,80,0.35);
    }
    #runBtn.won {
      background: var(--sage);
      box-shadow: 0 4px 24px rgba(100,150,90,0.3);
    }

    /* Wrapper que ocupa toda la pantalla para mover el botón libremente */
    #btnWrap {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }
    #btnWrap button {
      pointer-events: all;
      position: absolute;
    }

    .win-msg {
      display: none;
      position: fixed;
      bottom: 3rem;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--sage);
      z-index: 30;
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .conf-petal {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      animation: confFall linear forwards;
    }
    @keyframes confFall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateY(55vh) rotate(540deg) scale(0.4); }
    }

    .footer {
      position: fixed;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(107,79,58,0.2);
      z-index: 10;
    }
  </style>

  <!-- Botón libre por toda la pantalla -->

  <div class="footer">hecho con amor para que respires un momento</div>

  <script>
    const btn = document.getElementById('runBtn');
    const wrap = document.getElementById('btnWrap');
    const winMsg = document.getElementById('winMsg');
    const petalColors = ['#e8a0a0','#f2c4b0','#c96a6a','#d9b0a0','#f0d0c0','#8a9e85'];

    let won = false;
    let placed = false;

    // Posición inicial centrada
    function centerBtn() {
      btn.style.left = (window.innerWidth / 2 - btn.offsetWidth / 2) + 'px';
      btn.style.top  = (window.innerHeight / 2 - btn.offsetHeight / 2) + 'px';
    }

    window.addEventListener('load', () => {
      centerBtn();
      placed = true;
    });

    // Pétalos flotantes de fondo
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'petal-float';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.top = '-40px';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 14) + 's';
      const size = 6 + Math.random() * 10;
      p.innerHTML = `<svg width="${size}" height="${size*1.4}" viewBox="0 0 10 14" fill="none"><ellipse cx="5" cy="7" rx="4" ry="6.5" fill="${petalColors[Math.floor(Math.random()*petalColors.length)]}" opacity="0.65"/></svg>`;
      document.body.appendChild(p);
    }

    function moveBtn() {
      if (won) return;
      const bw = btn.offsetWidth;
      const bh = btn.offsetHeight;
      const pad = 32;
      const x = pad + Math.random() * (window.innerWidth  - bw - pad * 2);
      const y = pad + Math.random() * (window.innerHeight - bh - pad * 2);
      btn.style.left = x + 'px';
      btn.style.top  = y + 'px';
    }

    function spawnPetals() {
      for (let i = 0; i < 60; i++) {
        const p = document.createElement('div');
        p.className = 'conf-petal';
        p.style.left = (5 + Math.random() * 90) + 'vw';
        p.style.top  = (5 + Math.random() * 40) + 'vh';
        const size = 8 + Math.random() * 16;
        const color = petalColors[Math.floor(Math.random() * petalColors.length)];
        p.innerHTML = `<svg width="${size}" height="${size*1.4}" viewBox="0 0 10 14" fill="none"><ellipse cx="5" cy="7" rx="4" ry="6.5" fill="${color}"/></svg>`;
        p.style.animationDuration = (1 + Math.random() * 1.8) + 's';
        p.style.animationDelay    = (Math.random() * 0.8) + 's';
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    btn.addEventListener('mouseover', moveBtn);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); }, { passive: false });
    btn.addEventListener('click', (e) => { e.preventDefault(); moveBtn(); });
  </script>
